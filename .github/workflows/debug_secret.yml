name: Debug secret wiring

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Report which names are populated (length only, never the value)
        env:
          A: ${{ secrets.POLLINATIONS_API_KEY }}
          B: ${{ secrets.POLLINATION_API_KEY }}
          C: ${{ secrets.POLLINATIONS_KEY }}
          D: ${{ secrets.POLLINATIONS_API_TOKEN }}
          E: ${{ secrets.POLLEN_API_KEY }}
          VA: ${{ vars.POLLINATIONS_API_KEY }}
          VB: ${{ vars.POLLINATIONS_KEY }}
        run: |
          check () {
            name="$1"; val="$2"
            if [ -z "$val" ]; then
              echo "  $name = (empty)"
            else
              printf '  %s = SET, length %s, starts %s\n' \
                "$name" "${#val}" "$(printf '%s' "$val" | cut -c1-3)"
            fi
          }
          echo "--- SECRETS ---"
          check "secrets.POLLINATIONS_API_KEY"   "$A"
          check "secrets.POLLINATION_API_KEY"    "$B"
          check "secrets.POLLINATIONS_KEY"       "$C"
          check "secrets.POLLINATIONS_API_TOKEN" "$D"
          check "secrets.POLLEN_API_KEY"         "$E"
          echo "--- VARIABLES ---"
          check "vars.POLLINATIONS_API_KEY"      "$VA"
          check "vars.POLLINATIONS_KEY"          "$VB"

      - name: Live balance check if the expected secret is set
        if: ${{ secrets.POLLINATIONS_API_KEY != '' }}
        env:
          K: ${{ secrets.POLLINATIONS_API_KEY }}
        run: |
          echo "calling /account/balance ..."
          code=$(curl -s -o /tmp/b.json -w '%{http_code}' \
            -H "Authorization: Bearer $K" \
            https://gen.pollinations.ai/account/balance)
          echo "HTTP $code"
          cat /tmp/b.json; echo
