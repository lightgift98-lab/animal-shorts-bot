name: Debug secret wiring

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Pollinations account diagnostics
        env:
          K: ${{ secrets.POLLINATIONS_API_KEY || secrets.SK_VIDEO }}
        run: |
          if [ -z "$K" ]; then echo "no key set"; exit 0; fi
          printf 'key length %s, prefix %s\n' "${#K}" "$(printf '%s' "$K" | cut -c1-3)"

          echo; echo "--- /account/balance ---"
          curl -s -w '\nHTTP %{http_code}\n' -H "Authorization: Bearer $K" \
            https://gen.pollinations.ai/account/balance

          echo; echo "--- /account/profile ---"
          curl -s -w '\nHTTP %{http_code}\n' -H "Authorization: Bearer $K" \
            https://gen.pollinations.ai/account/profile | head -c 600

          echo; echo "--- /account/key (budget on this key) ---"
          curl -s -w '\nHTTP %{http_code}\n' -H "Authorization: Bearer $K" \
            https://gen.pollinations.ai/account/key | head -c 600

          echo; echo "--- /account/quests (claimable free pollen) ---"
          curl -s -w '\nHTTP %{http_code}\n' -H "Authorization: Bearer $K" \
            https://gen.pollinations.ai/account/quests | head -c 900

          echo; echo "--- cheapest possible video call (wan-fast 5s) ---"
          curl -s -o /tmp/v.bin -w 'HTTP %{http_code} type=%{content_type} bytes=%{size_download}\n' \
            -H "Authorization: Bearer $K" \
            "https://gen.pollinations.ai/video/a%20puppy%20runs?model=wan-fast&duration=5&aspectRatio=9:16"
          head -c 400 /tmp/v.bin; echo
