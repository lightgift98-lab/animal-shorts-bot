name: Post Animal Short

on:
  schedule:
    # 5x a day, evenly spread (~4h48m apart) across the clock
    - cron: "0 1,6,11,16,21 * * *"   # 01,06,11,16,21 UTC
  workflow_dispatch:          # Adds a manual "Run workflow" button in GitHub
    inputs:
      dry_run:
        description: "Build the video but do NOT upload"
        type: boolean
        default: false
      model:
        description: "Video model override (blank = repo default)"
        required: false
        default: ""
      sample_scenes:
        description: "Collapse to N scenes for a cheap test (blank = all 5)"
        required: false
        default: ""

concurrency:
  group: post-short
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng libsndfile1 fonts-dejavu-core

      - name: Python deps
        run: pip install -r requirements.txt

      - name: Cache TTS model
        uses: actions/cache@v4
        with: { path: models, key: kokoro-onnx-1.0 }

      - name: Download TTS model (only if not cached)
        run: |
          mkdir -p models
          [ -f models/kokoro-v1.0.onnx ] || curl -L --fail -o models/kokoro-v1.0.onnx \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          [ -f models/voices-v1.0.bin ] || curl -L --fail -o models/voices-v1.0.bin \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin

      - name: Run pipeline
        env:
          DRY_RUN:               ${{ inputs.dry_run && 'true' || 'false' }}
          PRIVACY_STATUS:        ${{ vars.PRIVACY_STATUS || 'public' }}
          # accept either name: the repo secret is SK_VIDEO
          POLLINATIONS_API_KEY:  ${{ secrets.POLLINATIONS_API_KEY || secrets.SK_VIDEO }}
          AI_VIDEO:              ${{ vars.AI_VIDEO || 'auto' }}
          VIDEO_MODEL:           ${{ inputs.model || vars.VIDEO_MODEL || 'wan-fast' }}
          SAMPLE_SCENES:         ${{ inputs.sample_scenes || '0' }}
          VIDEO_AUDIO:           ${{ vars.VIDEO_AUDIO || 'false' }}
          POLLEN_RESERVE:        ${{ vars.POLLEN_RESERVE || '0.05' }}
          GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}
          FREESOUND_API_KEY:     ${{ secrets.FREESOUND_API_KEY }}
          YOUTUBE_CLIENT_ID:     ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python pipeline.py

      - name: Upload video for review (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-video
          path: |
            output/final.mp4
            output/thumb.jpg
          retention-days: 7

      - name: Save output on failure (debugging)
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: failed-run, path: output/, retention-days: 3 }

      - name: Commit history (prevents repeats + keeps schedule alive)
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "actions@github.com"
          git add data/history.db
          git commit -m "log: $(date -u +%FT%TZ)" || { echo "no changes"; exit 0; }
          for i in 1 2 3; do
            git pull --rebase --autostash origin ${GITHUB_REF_NAME} && git push && exit 0
            echo "push retry $i"; sleep 5
          done
          echo "could not push history"; exit 0
